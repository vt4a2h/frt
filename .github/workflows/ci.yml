name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-gcc-14
          - os: ubuntu-latest
            preset: linux-clang-20
          - os: macos-latest
            preset: mac-clang
          - os: windows-latest
            preset: windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: llvm/actions/install-ninja@main

      - name: Install CMake
        if: matrix.os == 'ubuntu-latest'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '>=4.0.0'

      - name: Install Clang 20
        if: matrix.preset == 'linux-clang-20'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install libc++-dev
        shell: bash

      - name: Export GitHub Cache Variables
        shell: bash
        run: |
          echo "ACTIONS_CACHE_URL=${{ env.ACTIONS_CACHE_URL }}" >> $GITHUB_ENV
          echo "ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}" >> $GITHUB_ENV  

      - name: Activate Developer Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite
        shell: bash
        run: >
          cmake --preset ${{ matrix.preset }} 
          -DCMAKE_BUILD_TYPE=Release 
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Release

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -C Release
