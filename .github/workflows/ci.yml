name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            preset: linux-gcc-16
          - os: ubuntu-26.04
            preset: linux-clang-22
          - os: macos-latest
            preset: mac-clang
          - os: windows-latest
            preset: windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install gcc-16
        if: matrix.preset == 'linux-gcc-16'
        run: sudo apt install gcc-16 g++-16

      - name: Install Clang 22
        if: matrix.preset == 'linux-clang-22'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install libc++-dev
        shell: bash

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-binary-cache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            vcpkg-binary-cache-${{ runner.os }}-${{ matrix.preset }}-  

      - name: Activate Developer Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
        shell: bash
        run: >
          cmake --preset ${{ matrix.preset }} 
          -DCMAKE_BUILD_TYPE=Release 
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Release

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -C Release
