name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-gcc
          - os: ubuntu-latest
            preset: linux-clang
          - os: macos-latest
            preset: mac-clang
          - os: windows-latest
            preset: windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: llvm/actions/install-ninja@main

      - name: Setup vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
        shell: bash

      - name: Activate Developer Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Release

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -C Release
